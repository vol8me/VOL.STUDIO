[package]
name = "vol-life-tauri"
version = "0.1.0"
description = "VOL.LIFE native wrapper for desktop and mobile"
authors = ["VOL.STUDIO"]
edition = "2021"

# Android/iOS giriş noktası kütüphaneden gelir; üretilen native proje bu adı
# arar. Masaüstünde `main.rs` aynı `run()`u çağırır.
[lib]
name = "vol_life_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# Native kabuk PAYLAŞILIR: her oyunun ayrı Rust kopyası tutması, tek bir
# platform düzeltmesini birden çok yerde yapmak demekti.
volstudio-tauri = { path = "../../../tauri-v2/src-tauri", default-features = false }
tauri = { version = "2.11", features = ["protocol-asset", "rustls-tls"] }

# Eklentiler DOĞRUDAN bağımlılıktır: izin tanımları (`log:default` vb.)
# uygulama crate'inin bağımlılık ağacından toplanır.
tauri-plugin-log = "2.9"
tauri-plugin-store = "2.4"
# Kotlin kaynağı taşır: yalnız doğrudan bağımlı uygulamanın APK'sına girer.
tauri-plugin-vol-orientation = { path = "../../../tauri-v2/plugins/vol-orientation" }
tauri-plugin-haptics = "2.3.3"

# `custom-protocol` yalnız bu özellikten açılır. Bağımlılık satırında sabit
# açıldığında `tauri dev`in `--no-default-features`ı onu kapatamıyor, pencere dev
# sunucusu yerine son `vite build` çıktısını gösteriyordu (ölçüldü).
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol", "volstudio-tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
