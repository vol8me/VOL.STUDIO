"$schema" = "schemas/schema.json"

[default]
description = "İsteğe bağlı Steamworks köprüsü: durum, Steam Input manifestosu ve aksiyon seti, kol listesi, glif, metin girişi, bağlama paneli ve Steam Cloud dosyaları."
permissions = [
  "allow-status",
  "allow-set-input-manifest",
  "allow-activate-action-set",
  "allow-controllers",
  "allow-action-glyph",
  "allow-show-text-input",
  "allow-show-floating-input",
  "allow-show-binding-panel",
  "allow-cloud-list",
  "allow-cloud-read",
  "allow-cloud-write",
  "allow-cloud-delete",
]
