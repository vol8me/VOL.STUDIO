[package]
name = "volstudio-tauri"
version = "0.1.0"
description = "VOL.STUDIO native wrapper for desktop and mobile"
authors = ["VOL.STUDIO"]
edition = "2021"

[lib]
name = "volstudio_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset", "rustls-tls"] }
tauri-plugin-log = "2.9"
tauri-plugin-store = "2.4"
tauri-plugin-sql = { version = "2.4", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[features]
default = ["custom-protocol", "mobile-entry"]
custom-protocol = ["tauri/custom-protocol"]
# JNI köprüsünü dışa aktaran mobil giriş noktası. Kabuk başka bir uygulamaya
# kütüphane olarak bağlanırken KAPATILIR; aksi halde semboller çakışır.
mobile-entry = []

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
