[package]
name = "volstudio-tauri"
version = "0.1.0"
description = "VOL.STUDIO shared Tauri runtime — consumed by each game's own app crate"
authors = ["VOL.STUDIO"]
edition = "2021"

# Yalnız KÜTÜPHANE. `staticlib`/`cdylib` mobil giriş noktası üreten uygulama
# crate'lerinin işidir; paylaşılan kabuk onların içine `rlib` olarak girer.
[lib]
name = "volstudio_tauri_lib"
crate-type = ["rlib"]

# `tauri-build` YOKTUR ve build.rs de yoktur: o adım `generate_context!()`
# çağıran UYGULAMA crate'lerinin işidir ve bir `tauri.conf.json` arar. Bu crate
# bir uygulama olmadığı için kendi config'ini taşımaz.

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset", "rustls-tls"] }
tauri-plugin-log = "2.9"
tauri-plugin-store = "2.4"
tauri-plugin-sql = { version = "2.4", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
