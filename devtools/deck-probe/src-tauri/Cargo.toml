[package]
name = "vol-deck-probe"
version = "0.1.0"
description = "VOL.STUDIO Deck ölçüm sondası — paylaşılan kabuğun ilk aktif tüketicisi"
authors = ["VOL.STUDIO"]
edition = "2021"

# Sonda masaüstü-native'dir: Android/iOS giriş noktası (lib/staticlib) yoktur.

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# Native kabuk PAYLAŞILIR: sonda oyunların koştuğu aynı çizim/eklenti
# kurulumunu test eder; kopyası olsa Deck'te ölçülen şey üründen ayrışırdı.
volstudio-tauri = { path = "../../../tauri-v2/src-tauri", default-features = false }
tauri-plugin-vol-diagnostics = { path = "../../../tauri-v2/plugins/vol-diagnostics" }
# Steamworks köprüsü hep bağımlılıktır ama istemci SDK'sı ancak `steamworks`
# feature'ı ile derlenir; stub yapıda eklenti "kullanılamıyor" bildirir.
tauri-plugin-vol-steamworks = { path = "../../../tauri-v2/plugins/vol-steamworks" }
tauri = { version = "2.11", features = ["rustls-tls"] }

# İzin tanımları uygulama crate'inin bağımlılık ağacından toplanır (vol-hell
# kalıbı): kabuğun kurduğu eklentiler burada da görünür olmalıdır.
tauri-plugin-log = "2.9"
tauri-plugin-store = "2.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol", "volstudio-tauri/custom-protocol"]
# Gerçek Steamworks istemci bağlantısı yalnız bu feature'la derlenir —
# `tauri build --features steamworks`. Stub yapıda SDK'ya hiç dokunulmaz.
steamworks = ["tauri-plugin-vol-steamworks/steamworks"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
